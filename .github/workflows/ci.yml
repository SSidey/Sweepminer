name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: gdformat --check src tests
      - run: gdlint src tests
      - run: python dev_kit/ci/godot/scripts/check_size_budgets.py
      - run: python dev_kit/ci/godot/scripts/check_naming.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: "4.7.2"
          paths: "res://tests"
