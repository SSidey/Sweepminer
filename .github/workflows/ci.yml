name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: gdformat --check src tests
      - run: gdlint src tests
      - run: python dev_kit/ci/godot/scripts/check_size_budgets.py
      - run: python dev_kit/ci/godot/scripts/check_naming.py
      - run: python dev_kit/ci/godot/scripts/check_isp.py
      - run: python dev_kit/ci/godot/scripts/check_dip_direction.py
      - run: python dev_kit/ci/godot/scripts/check_helper_promotion.py
      - run: python dev_kit/ci/godot/scripts/check_ocp_shotgun_surgery.py origin/main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: godot-gdunit-labs/gdUnit4-action@v1.3.2
        with:
          godot-version: "4.7.2"
          paths: "res://tests"
          # No test suites exist yet (Phase 0 scaffold only), so there's no report to
          # publish/upload - re-enable both once Phase 1 adds real GdUnit4 tests.
          publish-report: false
          upload-report: false
