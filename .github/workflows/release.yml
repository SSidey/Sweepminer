name: Release

# See Decision 5 in sweepminer-spec-v0.3.md for the full versioning/scoring scheme this
# workflow implements.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  determine-bump:
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.bump.outputs.BUMP }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - id: bump
        name: Determine version bump
        run: python dev_kit/ci/godot/scripts/determine_version_bump.py >> "$GITHUB_OUTPUT" || true

  release:
    needs: determine-bump
    if: needs.determine-bump.outputs.bump != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt

      - name: Run tests for the release score
        uses: godot-gdunit-labs/gdUnit4-action@v1.3.2
        with:
          godot-version: "4.7.2"
          paths: "res://tests"
          report-name: "release-report.xml"
          publish-report: false
          upload-report: false
        continue-on-error: true

      - name: Tag the release
        run: |
          git tag "${{ needs.determine-bump.outputs.bump }}"
          git push origin "${{ needs.determine-bump.outputs.bump }}"

      - name: Record progress and generate the playtest entry
        run: |
          python dev_kit/ci/godot/scripts/report_progress.py "${{ needs.determine-bump.outputs.bump }}"
          REPORT=$(find . -name "release-report.xml" -print -quit)
          if [ -n "$REPORT" ]; then
            python dev_kit/ci/godot/scripts/generate_release_playtest_entry.py "${{ needs.determine-bump.outputs.bump }}" --junit-report "$REPORT"
          else
            python dev_kit/ci/godot/scripts/generate_release_playtest_entry.py "${{ needs.determine-bump.outputs.bump }}"
          fi

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/release-${{ needs.determine-bump.outputs.bump }}-playtest-entry"
          git config user.name "sweepminer-release-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add VERSION PLAYTEST_LOG.md dev_kit/progress-log.md
          git commit -m "chore(release): ${{ needs.determine-bump.outputs.bump }} playtest entry"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): ${{ needs.determine-bump.outputs.bump }}" \
            --body "Auto-generated by .github/workflows/release.yml (Decision 5, sweepminer-spec-v0.3.md). Tag \`${{ needs.determine-bump.outputs.bump }}\` is already pushed against the commit that triggered this. Merging this PR only adds the VERSION bump and the new PLAYTEST_LOG.md entry for you to fill in after playing."
